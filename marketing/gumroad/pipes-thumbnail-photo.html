<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url("../../site/assets/fonts/ibm-plex-sans.woff");font-weight:100 700;font-stretch:85% 100%}
@font-face{font-family:SrcSerif;src:url("../../site/assets/fonts/source-serif-4.woff");font-weight:200 900}
@font-face{font-family:Mono;src:url("../../site/assets/fonts/courier-prime-bold.woff");font-weight:700}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:1200px;overflow:hidden;position:relative;font-family:Plex;background:#14130f}
.ph{position:absolute;inset:0;background:url("../../private/photos/b5103.jpg") center 40%/cover;filter:grayscale(1) contrast(1.08) brightness(.9)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,19,15,.92) 0%,rgba(20,19,15,.55) 34%,rgba(20,19,15,.15) 55%,rgba(20,19,15,.75) 80%,rgba(20,19,15,.96) 100%)}
.top{position:absolute;left:70px;top:64px;right:70px}
.kick{font-family:Mono;font-weight:700;font-size:28px;letter-spacing:.14em;color:#e8b3a8;text-transform:uppercase}
h1{font-weight:700;font-stretch:85%;color:#f8f5ee;font-size:150px;line-height:.92;margin-top:18px;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.sub{font-family:SrcSerif;color:#efe9dc;font-size:42px;line-height:1.25;margin-top:22px;max-width:900px;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.bottom{position:absolute;left:70px;right:70px;bottom:64px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.tags{display:flex;flex-direction:column;gap:14px}
.tag{background:#f8f5ee;color:#1f3a5f;font-weight:700;font-size:36px;padding:12px 24px;border-radius:8px;width:fit-content}
.price{background:#9e3022;color:#fff;font-weight:700;font-size:64px;line-height:1;padding:24px 34px;border-radius:14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.price small{display:block;font-size:26px;font-weight:600;margin-top:8px;letter-spacing:.02em}
.stamp{position:absolute;right:70px;top:66px;border:5px solid #e06a57;color:#e06a57;font-family:Mono;font-weight:700;font-size:34px;letter-spacing:.12em;padding:8px 18px;transform:rotate(-6deg)}
.credit{position:absolute;left:70px;bottom:22px;font-size:17px;color:rgba(248,245,238,.6)}
</style></head><body><div class="ph"></div><div class="shade"></div>
<div class="stamp">FIELD FILE</div>
<div class="top"><div class="kick">Lives At WW2 · Dossier No. 2</div>
<h1>The Pipes<br>at Dawn</h1>
<div class="sub">The pipers of Loos, El Alamein and D-Day. Every legend checked.</div></div>
<div class="bottom"><div class="tags"><div class="tag">27-page dossier</div><div class="tag">Maps · photo prints</div><div class="tag">Tribute certificate</div></div>
<div class="price">$10<small>COMPLETE PACK</small></div></div>
<div class="credit">Photo: Sword Beach, 6 June 1944 (IWM B 5103, public domain)</div>
</body></html>
