<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url("../../site/assets/fonts/ibm-plex-sans.woff");font-weight:100 700;font-stretch:85% 100%}
@font-face{font-family:SrcSerif;src:url("../../site/assets/fonts/source-serif-4.woff");font-weight:200 900}
@font-face{font-family:Mono;src:url("../../site/assets/fonts/courier-prime-bold.woff");font-weight:700}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:1200px;overflow:hidden;background:#1b1a17;position:relative;font-family:Plex}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 60%,#2d2a24 0%,#1b1a17 70%)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#f8f5ee 1px,transparent 1px),linear-gradient(90deg,#f8f5ee 1px,transparent 1px);background-size:60px 60px}
.top{position:absolute;left:70px;top:70px;right:70px}
.kick{font-family:Mono;font-weight:700;font-size:30px;letter-spacing:.12em;color:#e8b3a8;text-transform:uppercase}
h1{font-weight:700;font-stretch:85%;color:#f8f5ee;font-size:128px;line-height:.95;margin-top:22px;letter-spacing:-.01em}
.sub{font-family:SrcSerif;color:#e9e5dc;font-size:40px;line-height:1.25;margin-top:26px;width:560px}
.cover{position:absolute;right:58px;bottom:70px;width:520px;background:#fff;padding:16px;transform:rotate(4deg);box-shadow:0 30px 60px rgba(0,0,0,.55)}
.cover img{width:100%;display:block}
.stamp{position:absolute;left:70px;bottom:250px;border:6px solid #c0503f;color:#e06a57;font-family:Mono;font-weight:700;font-size:44px;letter-spacing:.1em;padding:10px 22px;transform:rotate(-6deg)}
.tags{position:absolute;left:70px;bottom:70px;display:flex;flex-direction:column;gap:14px}
.tag{background:#9e3022;color:#fff;font-weight:700;font-size:36px;padding:12px 24px;border-radius:8px;width:fit-content}
.tag.n{background:#f8f5ee;color:#1f3a5f}
</style></head><body><div class="bg"></div><div class="grid"></div>

<div class="stamp">CASE FILE</div>
